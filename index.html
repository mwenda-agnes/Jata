<body>
<div class="progress" id="progress" aria-hidden="true"></div>
<a class="skip" href="#app">Skip to content</a>

<div class="topbar">
  <div class="wrap">
    <span id="tagline"></span>
    <span class="tb-right"><span id="tbContact"></span><span id="tbSocial" class="social"></span></span>
  </div>
</div>

<header class="header" id="header">
  <div class="wrap nav">
    <a href="#/" class="logo" aria-label="JATAPR home"><span class="logo-mark">J</span>JATAPR</a>
    <nav class="menu" id="menu" aria-label="Main">
      <a href="#/" data-r="">Home</a>
      <div class="has-mega" id="megaWrap">
        <a href="#/services" data-r="services" id="svcTrigger" aria-haspopup="true" aria-expanded="false">Services <i class="chev"></i></a>
        <div class="mega" id="mega" role="region" aria-label="Services menu"></div>
      </div>
      <a href="#/about" data-r="about">About Us</a>
      <a href="#/pricing" data-r="pricing">Pricing</a>
      <a href="#/portfolio" data-r="portfolio">Portfolio</a>
      <a href="#/resources" data-r="resources">Resources</a>
      <a href="#/contact" data-r="contact">Contact Us</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Search">🔍</button>
      <button class="icon-btn" id="themeBtn" aria-label="Switch to dark theme" aria-pressed="false">🌙</button>
      <a href="#/quote" class="btn btn-orange nav-cta">Get a Free Quote</a>
      <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
  <div class="mobile" id="mobile"></div>
</header>

<div class="search-pop" id="searchPop" hidden>
  <input type="search" id="searchInput" placeholder="Search services…" aria-label="Search services">
  <div id="searchRes"></div>
</div>

<main id="app" tabindex="-1"></main>

<footer class="footer" id="footer"></footer>

<div class="mascot" id="mascot" aria-live="polite">
  <div class="bubble" id="bubble" hidden></div>
  <div class="panel" id="panel" hidden></div>
  <div class="m-social" id="mSocial"></div>
  <button class="mascot-btn" id="mascotBtn" aria-label="Open JATAPR assistant"></button>
</div>

<button class="totop" id="toTop" aria-label="Back to top">↑</button>

<script src="script.js"></script>
</body>
</html>
